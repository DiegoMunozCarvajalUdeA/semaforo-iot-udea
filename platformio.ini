; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32dev]
; version fija: ESP-IDF 6.1 (el cliente MQTT es el componente espressif/mqtt)
platform = espressif32 @ 8.0.0
board = esp32dev
framework = espidf

; particion de aplicacion de 1.5 MB (PlatformIO ignora la tabla elegida en sdkconfig)
board_build.partitions = partitions_singleapp_large.csv

upload_port = COM5
monitor_port = COM5
monitor_speed = 115200

; certificados mTLS: PlatformIO genera el ensamblador a partir de esta lista.
; deben coincidir con EMBED_TXTFILES de src/CMakeLists.txt (ver RED.md)
board_build.embed_txtfiles =
    certs/ca.crt
    certs/esp32.crt
    certs/esp32.key
