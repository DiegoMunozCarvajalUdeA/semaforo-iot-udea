# Listener MQTT con TLS mutuo (mTLS) para el semaforo IoT.
# Se instala en /etc/mosquitto/conf.d/ con raspberry/instalar_broker.sh

listener 8883
protocol mqtt

cafile /etc/mosquitto/certs/ca.crt
certfile /etc/mosquitto/certs/server.crt
keyfile /etc/mosquitto/certs/server.key
tls_version tlsv1.2

# Exige certificado de cliente firmado por la CA y usa su CN como usuario.
require_certificate true
use_identity_as_username true

allow_anonymous false
acl_file /etc/mosquitto/acl

connection_messages true
